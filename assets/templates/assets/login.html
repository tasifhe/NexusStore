{% extends 'assets/base.html' %}

{% block title %}Login - GameAsset Store{% endblock %}

{% block content %}

<div class="login-page">
    <div class="login-card">
        <div class="login-card-header">
            <i class="fas fa-sign-in-alt login-card-icon"></i>
            <h2 class="login-card-title">Welcome Back</h2>
            <p class="login-card-subtitle">Sign in to your account</p>
        </div>

        <form method="post" class="login-form">
            {% csrf_token %}
            <div>
                <label for="username" class="login-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" required
                       class="login-input"
                       placeholder="Enter your username">
            </div>

            <div>
                <label for="password" class="login-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required
                       class="login-input"
                       placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary login-btn-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="login-card-footer">
            <p class="login-card-footer-text">Don't have an account?</p>
            <a href="{% url 'assets:register' %}" class="btn btn-secondary login-btn-register">
                <i class="fas fa-user-plus"></i> Create Account
            </a>
        </div>

        <div class="login-demo-info">
            <p class="login-demo-info-text">
                <i class="fas fa-info-circle"></i>
                Demo accounts: admin/admin123, artist1/password123, developer1/password123
            </p>
        </div>
    </div>
</div>

<style>
.login-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 2rem;
}
.login-card {
    background: white;
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
}
.login-card-header {
    text-align: center;
    margin-bottom: 2rem;
}
.login-card-icon {
    font-size: 3rem;
    color: #667eea;
    margin-bottom: 1rem;
}
.login-card-title {
    color: #333;
    margin-bottom: 0.5rem;
}
.login-card-subtitle {
    color: #666;
}
.login-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}
.login-label {
    display: block;
    margin-bottom: 0.5rem;
    color: #333;
    font-weight: 500;
}
.login-input {
    width: 100%;
    padding: 1rem;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
    outline: none;
}
.login-input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
}
.login-btn-submit {
    width: 100%;
    padding: 1rem;
    font-size: 1.1rem;
    margin-top: 1rem;
}
.login-card-footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #e0e0e0;
}
.login-card-footer-text {
    color: #666;
    margin-bottom: 1rem;
}
.login-btn-register {
    width: 100%;
    padding: 1rem;
}
.login-demo-info {
    text-align: center;
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(102, 126, 234, 0.05);
    border-radius: 10px;
}
.login-demo-info-text {
    margin: 0;
    color: #667eea;
    font-size: 0.9rem;
}
</style>
{% endblock %}
